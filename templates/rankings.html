<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ sport }} Rankings</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="sports-nav">
    <div class="nav-container">
      <a href="{{ url_for('landing') }}" class="nav-logo">🏆 Sports Analytics Hub</a>
      <div class="nav-links">
        <a href="{{ url_for('football') }}" class="nav-link">🏈 Football</a>
        <a href="{{ url_for('basketball') }}" class="nav-link">🏀 Basketball</a>
        <a href="{{ url_for ('logout') }}" class="nav-link">🚪 Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1> PPI (Pure Power Index)</h1>
    <p>Ratings derived exclusively from game outcomes compared to expected and average.</p>
    <a href="{{ back_url }}" class="nav-link">← Back to Predictor</a>

    <div style="margin: 30px 0;">
      <table class="predictions-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Rating</th>
          </tr>
        </thead>
        <tbody>
          {% for _, row in rankings.iterrows() %}
          <tr>
            <td style="text-align: center; font-weight: 700;">{{ row.Rank }}</td>
            <td>{{ row.team }}</td>
            <td style="font-weight: 600;">
                {{ row.rating }}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
